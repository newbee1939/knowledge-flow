name: Daily Report

# 毎日深夜 03:37 JST に /daily-report Skill を実行し、当日のレポートを main へ push する（P3）。
# この push は GITHUB_TOKEN で行われるため push イベントとしては pages.yml を起動できない。
# pages.yml 側が本ワークフローの完了を workflow_run で直接受けて起動し、サイトが自動更新される（P3-4 の連鎖）。
#
# schedule は起動を保証しない。実測では 34 分〜7 時間半の遅延があり、混雑時は実行自体が
# スキップされうる（GitHub の仕様）。加えて、起動しても生成の途中で失敗する日がある
# （2026-08-24 / 2026-08-27。どちらも手動で再実行して復旧した）。
# そこで 1 時間おきに 4 回起動し、当日分の記事がまだ無ければ作る、という形にしている。
# 「起動しなかった」と「途中で失敗した」を同じ 1 つの仕組みで拾えるのが狙い。
# 4 回のあいだに本番・予備の区別は無い。当日分ができた時点で、以降はスキップされる。
#
# 朝までに 1 本あればよいので、起動は朝までに閉じている。これは取りこぼし対策でもある。
# SKILL.md 手順 3 の取得ウィンドウ（24 時間）は実行時刻を基準にスライドするため、
# 遅い時刻に復旧するほど前日ぶんのニュースが穴になる。早い時間帯に固めておけば、
# 最後の 06:37 まで持ち越しても穴は 3 時間で収まる。
on:
  schedule:
    # cron は UTC で書く（ARCHITECTURE.md の落とし穴 5）。18:37〜21:37 UTC = 03:37〜06:37 JST。
    # 正時ちょうどは実行が集中して遅延しやすいため、分をずらしている。
    - cron: '37 18-21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '当日分が既にあっても作り直す'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # Claude GitHub App トークンの OIDC 交換に必要（下の claude-code-action のコメント参照）

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo # SKILL.md の「今日を JST で確定」を実行環境でも保証する（落とし穴 5）
      # 指示は下の 2 ステップ（サブスクリプション／API キー）で共有する。片方だけ直して
      # ズレるのを防ぐため、ステップに直書きせず env に置く。
      PROMPT: |
        /daily-report を実行してください。
        コミットまでで止め、push はしないでください（push は後続のステップが行います）。
        claude/ プレフィックスのブランチは作らないでください。
        書き込み・コミットしてよいのは docs/ 配下と .claude/skills/daily-report/failures.json だけです。src/ や .github/ など他の場所は変更しないでください。
      CLAUDE_ARGS: |
        --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
        --model opus
    steps:
      # .claude/skills/ を Claude に読ませるため、先に checkout する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 当日分が既にあるなら、この run は何もせず成功で終える（複数回起動するための冪等化）。
      # 途中で失敗した run のランナーは破棄されコミットが残らないため、
      # main にファイルがある = SKILL.md の手順 11（commit）まで到達している、と見なせる。
      # Claude の起動より前に置き、スキップ時は concurrency の待ち行列をすぐ空ける。
      #
      # スキップした run も success で終わるため、pages.yml が workflow_run で発火し、
      # 中身の同じサイトを再デプロイする（1 回あたり約 1 分、通常日は 3 回）。
      # 冪等で実害が無いため、無駄が気になるまで抑制は入れない。
      # なお生成が「失敗」した run では、既存の conclusion == 'success' ガードで pages.yml が止まる。
      - id: check
        env:
          # 信用できない入力を run: に直接埋め込まない（CLAUDE.md の GitHub Actions ルール）
          FORCE: ${{ inputs.force }}
        run: |
          FILE="docs/blog/posts/$(date +%F).md"
          if [ "$FORCE" = 'true' ] || [ ! -f "$FILE" ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "$FILE は生成済みのためスキップした。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # push は Claude にさせず、最後の「push（docs/ 以外の変更があれば中止）」ステップが行う。
      # SKILL.md 自体も commit 止まりで固定してあり、ローカルの手動実行で main へ push されることはない。
      #
      # 【claude-code-action に登場する 3 つのトークンの整理】役割は完全に別物で、混同しやすい:
      #   1. CLAUDE_CODE_OAUTH_TOKEN … Anthropic への認証。Claude（AI）を使う許可で、GitHub とは無関係。
      #      サブスクリプションが切れたときの代役が ANTHROPIC_API_KEY（従量課金）。役割は同じで、支払い方が違う
      #   2. Claude GitHub App のトークン … claude-code-action が GitHub API を叩くための許可証（コメント投稿など）。
      #      github_token 入力を渡さない標準構成では、claude-code-action が起動時に App から OIDC 交換で取得する。
      #      App 未インストールだとこの取得に失敗し、claude-code-action 自体が起動しない（起動の関門）
      #   3. GITHUB_TOKEN … GitHub がジョブごとに全ワークフローへ自動支給するトークン。
      #      actions/checkout が既定（persist-credentials: true）で git 設定に認証情報として埋め込む。
      #      git push は GitHub API ではなく git プロトコルの通信で、git は git 設定の認証情報を
      #      機械的に使うため、最後の push ステップはこれを使う
      #      （2 の App トークンは claude-code-action のプロセス内にあるだけで、git からは見えない）
      #
      # つまり「App を入れたから push も App のトークンのはず」は誤り。push は 3 の GITHUB_TOKEN で行われ、
      # GITHUB_TOKEN による push は無限ループ防止の GitHub 仕様により他ワークフローの push トリガーを発火しない。
      # そのため pages.yml は on: push ではなく workflow_run で本ワークフローの完了を直接受けて起動する。
      - id: subscription
        if: steps.check.outputs.needed == 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # サブスクリプションが切れると 1 の OAuth トークンは無効になり、上のステップは必ず失敗する。
      # 従量課金の Claude API キー（secrets.ANTHROPIC_API_KEY）で実行し直し、毎朝の更新を止めない。
      #
      # 両方のトークンを 1 ステップに渡す書き方では代替にならない。claude-code-action は
      # 受け取った値を環境変数へ流すだけで（action.yml の ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN）、
      # どちらを使うかを決めるのは Claude Code 側。期限切れのトークンが残っている限りそちらが選ばれ、
      # API キーへは落ちてこない。だから「失敗したら実行し直す」という形にしている。
      - if: steps.subscription.outcome == 'failure'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # --- ここから先が「agent の外側」の検査。Claude には push させない ---
      #
      # SKILL.md 手順 2 は 20 以上の外部サイトから RSS / HTML を取得して読む。その中身
      # （記事タイトル・本文）は第三者が書けるため、「これまでの指示を無視して〜」のような
      # 文字列を仕込まれ、AI がそれを指示として実行してしまう余地がある（間接プロンプト
      # インジェクション）。「docs/ 配下のみ」はプロンプトに書いた"お願い"でしかなく、
      # 誘導されれば破られる。そこで push の直前に、変更が許可された場所に収まっているかを
      # ワークフロー側で機械的に確かめる。この検査は Claude のプロセスの外にあるので、
      # 誘導されたセッション自身には無効化できない。
      #
      # 比較の基点はチェックアウトしたコミット（$GITHUB_SHA）。Claude が作った全コミットの
      # 変更ファイルがこの差分に出る。
      - name: push（許可された場所の外に変更があれば中止）
        if: steps.check.outputs.needed == 'true'
        run: |
          # 「許可された場所の外で変わったファイル」は git のパススペックに直接聞く。
          # grep で弾くとシェルの挙動に依存するうえ、読んで正しさが分かりにくい。
          #
          # 例外は failures.json ただ 1 ファイル（SKILL.md の「連続失敗の記録」がここに書く）。
          # .claude/skills/ ごと許すことはしない。同じ場所に SKILL.md ＝ AI 自身への指示書が
          # あり、それを書き換えられるとこの防護そのものを外されうる。
          changed=$(git diff --name-only "$GITHUB_SHA" HEAD)
          outside=$(git diff --name-only "$GITHUB_SHA" HEAD \
            -- ':(exclude)docs/' ':(exclude).claude/skills/daily-report/failures.json')

          if [ -z "$changed" ]; then
            echo '生成されたコミットが無いため push しない。' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$outside" ]; then
            {
              echo '## 許可された場所の外が変更されたため push を中止した'
              echo '```'
              echo "$outside"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push origin HEAD:main
