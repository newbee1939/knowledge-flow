name: Period Summary

# 毎月 1 日に /period-summary Skill を実行し、前月（1 月なら前年も）のひとことタイトルを
# docs/blog/summaries.json へ書いて main へ push する。
# トークンの扱い・push が pages.yml を直接起動できない事情は daily-report.yml のコメントを参照。
on:
  schedule:
    # daily-report.yml の初回と同じ 1 日 01:37 JST に走らせる。cron は UTC で書く（ARCHITECTURE.md の落とし穴 5）。
    # 01:37 JST は前日 16:37 UTC、つまり UTC では「月末日」になる。cron では月末日を直接書けないため
    # 28〜31 日に起動し、下の check ステップで「JST の今日が 1 日」の run だけを通す。
    - cron: '37 16 28-31 * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'YYYY-MM または YYYY（省略時は前月）'
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: period-summary
  cancel-in-progress: false

jobs:
  period-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo # 「前月」を JST で確定させる
      # 指示は下の 2 ステップで共有する（daily-report.yml と同じ理由）
      PROMPT: |
        /period-summary ${{ inputs.period }} を実行してください。
        コミットまでで止め、push はしないでください（push は後続のステップが行います）。
        claude/ プレフィックスのブランチは作らないでください。
        書き込み・コミットしてよいのは docs/ 配下のみです。src/ や .github/ など他の場所は変更しないでください。
      CLAUDE_ARGS: |
        --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
        --model opus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # schedule は 28〜31 日に起動するので、JST の 1 日でなければ何もせず成功で終える。
      # 手動実行（workflow_dispatch）はいつでも通す。
      # スキップした run も success なので pages.yml が再デプロイするが、月 3 回程度で実害は無い。
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != 'schedule' ] || [ "$(date +%d)" = '01' ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

      - id: subscription
        if: steps.check.outputs.needed == 'true'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # サブスクリプションが切れたら従量課金の API キーで実行し直す（理由は daily-report.yml のコメント）
      - if: steps.subscription.outcome == 'failure'
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # push するのはワークフローで、Claude ではない（理由は daily-report.yml の同じ
      # ステップを参照）。ここが読む日次レポートは外部サイト由来の文章を含むので、
      # プロンプトインジェクションの連鎖はこのワークフローにも届く。
      - name: push（触ってはいけない場所の変更があれば中止）
        if: steps.check.outputs.needed == 'true'
        run: |
          # 触ってよいのは docs/ だけ。':(exclude)docs/' は「docs/ を除いて」の意味で、
          # 除いてなお残れば、はみ出し。
          disallowed=$(git diff --name-only "$GITHUB_SHA" HEAD -- ':(exclude)docs/')

          if [ -n "$disallowed" ]; then
            echo "触ってはいけない場所が変更された:"
            echo "$disallowed"
            exit 1
          fi

          if [ -z "$(git diff --name-only "$GITHUB_SHA" HEAD)" ]; then
            echo 'コミットが 1 つも積まれていない'
            exit 1
          fi

          git push origin HEAD:main
