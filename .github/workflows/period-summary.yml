name: Period Summary

# 毎月 1 日に /period-summary Skill を実行し、前月（1 月なら前年も）のひとことタイトルを
# docs/blog/summaries.json へ書いて main へ push する。
# トークンの扱い・push が pages.yml を直接起動できない事情は daily-report.yml のコメントを参照。
on:
  schedule:
    # 1 日 09:00 JST = 1 日 00:00 UTC。cron は UTC で書く（ARCHITECTURE.md の落とし穴 5）。
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'YYYY-MM または YYYY（省略時は前月）'
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: period-summary
  cancel-in-progress: false

jobs:
  period-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo # 「前月」を JST で確定させる
      # 指示は下の 2 ステップで共有する（daily-report.yml と同じ理由）
      PROMPT: |
        /period-summary ${{ inputs.period }} を実行してください。
        完了したら、生成されたコミットを main ブランチへ直接 push してください（git push origin main）。
        claude/ プレフィックスのブランチは作らないでください。
        書き込み・コミットしてよいのは docs/ 配下のみです。src/ や .github/ など他の場所は変更しないでください。
      CLAUDE_ARGS: |
        --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
        --model opus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: subscription
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # サブスクリプションが切れたら従量課金の API キーで実行し直す（理由は daily-report.yml のコメント）
      - if: steps.subscription.outcome == 'failure'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}
