name: Period Summary

# 毎月 1 日に /period-summary Skill を実行し、前月（1 月なら前年も）のひとことタイトルを
# docs/blog/summaries.json へ書いて main へ push する。
# トークンの扱い・push が pages.yml を直接起動できない事情は daily-report.yml のコメントを参照。
on:
  schedule:
    # 1 日 09:00 JST = 1 日 00:00 UTC。cron は UTC で書く（ARCHITECTURE.md の落とし穴 5）。
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'YYYY-MM または YYYY（省略時は前月）'
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: period-summary
  cancel-in-progress: false

jobs:
  period-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo # 「前月」を JST で確定させる
      # 指示は下の 2 ステップで共有する（daily-report.yml と同じ理由）
      PROMPT: |
        /period-summary ${{ inputs.period }} を実行してください。
        コミットまでで止め、push はしないでください（push は後続のステップが行います）。
        claude/ プレフィックスのブランチは作らないでください。
        書き込み・コミットしてよいのは docs/ 配下のみです。src/ や .github/ など他の場所は変更しないでください。
      CLAUDE_ARGS: |
        --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
        --model opus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: subscription
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # サブスクリプションが切れたら従量課金の API キーで実行し直す（理由は daily-report.yml のコメント）
      - if: steps.subscription.outcome == 'failure'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.CLAUDE_ARGS }}

      # push は Claude にさせず、変更が docs/ に収まっているかを確かめてから行う
      # （理由は daily-report.yml の同じステップのコメントを参照）。
      # このワークフローが読む日次レポートは外部サイト由来の文章を含むため、injection の連鎖はここにも届く。
      - name: push（docs/ 以外の変更があれば中止）
        run: |
          # 「docs/ の外で変わったファイル」は git のパススペックに直接聞く。
          # grep で弾くとシェルの挙動に依存するうえ、読んで正しさが分かりにくい。
          changed=$(git diff --name-only "$GITHUB_SHA" HEAD)
          outside=$(git diff --name-only "$GITHUB_SHA" HEAD -- ':(exclude)docs/')

          if [ -z "$changed" ]; then
            echo '生成されたコミットが無いため push しない。' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$outside" ]; then
            {
              echo '## docs/ の外が変更されたため push を中止した'
              echo '```'
              echo "$outside"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push origin HEAD:main
